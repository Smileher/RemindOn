name: Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version with a nonzero major and zero revision, for example 1.8.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            architecture: x64
          - target: aarch64-pc-windows-msvc
            architecture: arm64
    runs-on: windows-latest
    env:
      REMINDON_STORE_BUILD: '1'
      VERSION: ${{ inputs.version }}
      MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Validate Store identity and version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^[1-9]\d*\.\d+\.\d+\.0$') { throw 'Store version must have a nonzero major and a zero fourth component, for example 1.8.0.0.' }
          foreach ($component in $env:VERSION.Split('.')) {
            $number = [uint16]0
            if (-not [uint16]::TryParse($component, [ref]$number)) { throw 'Store version components must be between 0 and 65535.' }
          }
          if ([string]::IsNullOrWhiteSpace($env:MSIX_IDENTITY_NAME) -or [string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER) -or [string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER_DISPLAY_NAME)) { throw 'Configure MSIX_IDENTITY_NAME, MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME repository secrets.' }
          if ([bool]$env:MSIX_PFX_BASE64 -ne [bool]$env:MSIX_PFX_PASSWORD) { throw 'Optional signing requires both MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD.' }
      - name: Build Store executable
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle --ci -- --locked
      - name: Write signing certificate
        shell: pwsh
        run: |
          if ($env:MSIX_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\remindon-signing.pfx", [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          }
      - name: Package MSIX with optional local signing
        shell: pwsh
        run: |
          $source = "src-tauri\target\${{ matrix.target }}\release\remindon.exe"
          $version = $env:VERSION
          $signing = @{}
          if ($env:MSIX_PFX_BASE64) {
            $signing.CertificatePath = "$env:RUNNER_TEMP\remindon-signing.pfx"
            $signing.CertificatePassword = $env:MSIX_PFX_PASSWORD
          }
          & ./scripts/package-msix.ps1 -Architecture '${{ matrix.architecture }}' -Version $version -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -SourceExecutable $source -IconPath 'src-tauri\icons\128x128.png' -OutputDirectory "$env:GITHUB_WORKSPACE\store-output" @signing
      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.architecture }}
          path: store-output/*.msix

  bundle:
    needs: package
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      MSIX_PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
      MSIX_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: msix-*
          path: store-input
          merge-multiple: true
      - name: Validate and write signing certificate
        shell: pwsh
        run: |
          if ([bool]$env:MSIX_PFX_BASE64 -ne [bool]$env:MSIX_PFX_PASSWORD) { throw 'Optional signing requires both MSIX_PFX_BASE64 and MSIX_PFX_PASSWORD.' }
          if ($env:MSIX_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\remindon-signing.pfx", [Convert]::FromBase64String($env:MSIX_PFX_BASE64))
          }
      - name: Create MSIX bundle with optional local signing
        shell: pwsh
        run: |
          $signing = @{}
          if ($env:MSIX_PFX_BASE64) {
            $signing.CertificatePath = "$env:RUNNER_TEMP\remindon-signing.pfx"
            $signing.CertificatePassword = $env:MSIX_PFX_PASSWORD
          }
          ./scripts/bundle-msix.ps1 -Version $env:VERSION -InputDirectory "$env:GITHUB_WORKSPACE\store-input" -OutputDirectory "$env:GITHUB_WORKSPACE\store-output" @signing
      - uses: actions/upload-artifact@v4
        with:
          name: remindon-msix-store
          path: store-output/*.msixbundle
