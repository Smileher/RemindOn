name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync, existsSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tauri = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.TAG !== `v${version}` || tauri !== version || cargo !== version) {
            throw new Error('Run this workflow on a version tag matching package.json, Cargo.toml and tauri.conf.json');
          }
          const notesPath = `docs/releases/${version}.md`;
          if (!existsSync(notesPath)) {
            throw new Error(`Missing release notes: ${notesPath}`);
          }
          if (!readFileSync(notesPath, 'utf8').trim()) {
            throw new Error(`Release notes must not be empty: ${notesPath}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`, 'utf8');
          JS
      - name: Require updater signing key
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$UPDATER_KEY" || { echo 'Configure TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!require('./release-state.json').isDraft) throw new Error('This version is already published; use a new version tag')"
            release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          else
            release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="RemindOn $TAG" \
              -F draft=true -F body=@"docs/releases/${VERSION}.md" --jq .id)
          fi
          # The list endpoint can lag behind creation; use the ID from the creation response.
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo 'Could not resolve the draft release ID.'; exit 1; }
          gh release edit "$TAG" --title "RemindOn $TAG" --notes-file "docs/releases/${VERSION}.md"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_arch: x64
            bundles: nsis
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_arch: arm64
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Build signed update packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          includeUpdaterJson: false
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload Windows portable ZIP
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          $portable = "RemindOn_$($env:VERSION)_$($env:ASSET_ARCH)_portable.exe"
          $archive = "RemindOn_$($env:VERSION)_$($env:ASSET_ARCH)_portable.zip"
          $binary = "src-tauri/target/$($env:TARGET)/release/remindon.exe"
          Copy-Item -LiteralPath $binary -Destination $portable
          Compress-Archive -LiteralPath $portable -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash`n", [System.Text.Encoding]::ASCII)
          gh release upload "$env:TAG" "$archive" "$archive.sha256" --clobber
      - name: Upload macOS download checksum
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dmg="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/RemindOn_${VERSION}_aarch64.dmg"
          shasum -a 256 "$dmg" | awk '{print $1}' > "$dmg.sha256"
          gh release upload "$TAG" "$dmg.sha256" --clobber

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate complete update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          gh release download "$TAG" --pattern '*.sha256' --dir checksums
          node scripts/create-updater-manifest.mjs "$VERSION" release.json signatures checksums latest.json
          gh release upload "$TAG" latest.json --clobber
      - name: Remove temporary verification assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release.json', 'utf8'));
          if (!release.draft || release.tag_name !== process.env.TAG) {
            throw new Error('Only the matching draft release may be cleaned up');
          }
          if (!release.assets.some((asset) => asset.name === 'latest.json')) {
            throw new Error('Upload the complete update manifest before cleaning up');
          }
          const names = release.assets.filter((asset) => /\.(sig|sha256)$/.test(asset.name)).map((asset) => asset.name);
          writeFileSync('verification-assets.txt', names.length ? `${names.join('\n')}\n` : '', 'utf8');
          JS
          while IFS= read -r asset; do
            gh release delete-asset "$TAG" "$asset" --yes
          done < verification-assets.txt
          gh release edit "$TAG" --draft=false --latest
