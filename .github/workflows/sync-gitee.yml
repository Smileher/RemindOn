name: Retry Gitee release sync

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, for example v0.8.1
        required: true
        type: string
      legacy_x64:
        description: Only for historical releases without Windows ARM64 assets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitee-sync-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Linux 托管 runner 到 Gitee 多次出现长时间超时和 ECONNRESET，镜像使用另一类网络出口。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Gitee release sync
        run: node --test tests/sync-gitee.test.mjs
      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          gh release download "$TAG" --pattern '*.exe' --pattern '*.dmg' --pattern '*.app.tar.gz' --dir assets
          gh release download "$TAG" --pattern 'latest.json' --dir assets
      - name: Sync Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          LEGACY_X64: ${{ inputs.legacy_x64 }}
        run: |
          options=()
          if [[ "$LEGACY_X64" == 'true' ]]; then options+=(--legacy-x64); fi
          node scripts/sync-gitee-release.mjs "$TAG" release.json assets/latest.json assets "${options[@]}"
