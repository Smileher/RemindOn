name: Retry Gitee release sync

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, for example v0.8.1
        required: true
        type: string
      legacy_x64:
        description: Only for historical releases without Windows ARM64 assets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gitee-sync-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          gh release download "$TAG" --pattern '*.exe' --pattern '*.dmg' --pattern '*.app.tar.gz' --dir assets
          gh release download "$TAG" --pattern 'latest.json' --dir assets
      - name: Sync Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ inputs.tag }}
          LEGACY_X64: ${{ inputs.legacy_x64 }}
        run: |
          options=()
          if [[ "$LEGACY_X64" == 'true' ]]; then options+=(--legacy-x64); fi
          node scripts/sync-gitee-release.mjs "$TAG" release.json assets/latest.json assets "${options[@]}"
