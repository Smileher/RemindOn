[package]
name = "remindon"
version = "1.1.0"
description = "A small cross-platform desktop reminder"
authors = ["Smileher"]
edition = "2021"

[lib]
name = "remindon_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api 用于弹窗窗口透明（WKWebView 透明背景需私有 API）。
# 应用只走 dmg 直接分发、不上 Mac App Store，可以使用私有 API。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls-no-alpn"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
notify-rust = "4.18"
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
